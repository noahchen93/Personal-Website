<!DOCTYPE html>
<html lang="zh" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人作品集网站 - Personal Portfolio Website" />
    <meta name="keywords" content="portfolio, developer, react, typescript, projects" />
    <meta name="author" content="Your Name" />
    
    <!-- Open Graph Tags -->
    <meta property="og:title" content="个人作品集 | Personal Portfolio" />
    <meta property="og:description" content="个人作品集网站，展示项目、技能和经验" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoursite.com" />
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="个人作品集 | Personal Portfolio" />
    <meta name="twitter:description" content="个人作品集网站，展示项目、技能和经验" />
    
    <!-- Preload Critical Fonts -->
    <link rel="preload" href="/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/SF-Mono-Regular.woff2" as="font" type="font/woff2" crossorigin />
    
    <!-- Critical CSS will be injected here by Vite -->
    <title>个人作品集 | Personal Portfolio</title>
    
    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#0a0e1a" />
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      body { 
        visibility: hidden; 
        opacity: 0; 
        transition: opacity 0.3s ease-in-out;
        background-color: #0a0e1a;
        font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
      }
      body.loaded { 
        visibility: visible; 
        opacity: 1; 
      }
      
      /* Critical Loading Styles */
      .loading-screen {
        position: fixed;
        inset: 0;
        background: #0a0e1a;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #3b82f6;
        font-family: 'SF Mono', monospace;
      }
      
      .loading-spinner {
        border: 2px solid rgba(59, 130, 246, 0.3);
        border-top: 2px solid #3b82f6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-spinner"></div>
    </div>
    
    <!-- Main App Container -->
    <div id="root"></div>
    
    <!-- Main Script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Show body after page load -->
    <script>
      window.addEventListener('load', () => {
        document.body.classList.add('loaded');
        // Hide loading screen after React app mounts
        setTimeout(() => {
          const loadingScreen = document.getElementById('loading-screen');
          if (loadingScreen) {
            loadingScreen.style.display = 'none';
          }
        }, 1000);
      });
    </script>
  </body>
</html>
